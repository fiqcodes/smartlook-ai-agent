<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartLook · Sign in</title>
<style>body{margin:0;background:#f6f7fb;color:#172033;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{width:min(360px,80vw);padding:36px;background:white;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 12px 50px #1720330a}img{width:150px}h1{font-size:25px;margin-top:28px}p{color:#667085;line-height:1.6}label{display:block;font-weight:600;margin-bottom:8px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px}input{border:1px solid #cbd5e1}button{margin-top:16px;background:#f48024;border:0;color:white;font-weight:600;cursor:pointer}.error{color:#b42318}</style></head>
<body><main><img src="/assets/smartlook_logo.png" alt="SmartLook"><h1>Explore your data</h1><p>Enter the access password shared by the owner to start a conversation.</p><form method="post"><label for="password">Access password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" autofocus><button type="submit">Continue to SmartLook</button></form>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}</main></body></html>
